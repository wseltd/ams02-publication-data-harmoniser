[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ams02wb"
version = "0.1.0"
description = "AMS-02 publication data harmonizer and likelihood workbench"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
]

[project.scripts]
ams02wb = "ams02wb.cli.main:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
